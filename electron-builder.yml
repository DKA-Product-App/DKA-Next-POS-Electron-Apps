appId: com.dkaapis.product.pos
productName: DKA Cashier POS Apps
copyright: Copyright © 2025 Yovangga Anandhika

# ⬇️ Global options
compression: normal          # store | normal | maximum
asar: true                    # biar sumber di-pack ke app.asar
asarUnpack:
  - "**/*.node"               # kalau ada native addon, auto unpack
  - "**/*.{dll,exe,so,dylib}"
  - "node_modules/sharp/**"
  - "node_modules/sqlite3/**"
  - "node_modules/@prisma/engines/**"
  - "node_modules/puppeteer/.local-chromium/**"

directories:
  output: dist
  buildResources: resources

# ⬇️ Client cert/key DI LUAR asar (di process.resourcesPath/cert/client)
extraResources:
  - from: resources/cert/client
    to: cert/client            # -> .../resources/cert/client/*
    filter:
      - "**/*"

files:
  - from: .
    filter:
      - package.json
      - app
      - resources/cert/ca/**   # -> app.asar/resources/cert/ca/*

publish: null

electronLanguages: []

mac:
  icon: resources/icon.icns
  executableName: "DKA-POS"     # ⬅️ nama .exe final, bebas spasi/uppercase

win:
  icon: resources/icon.ico
  executableName: "DKA-Cashier-POS-Application"     # ⬅️ nama .exe final, bebas spasi/uppercase
  requestedExecutionLevel: "asInvoker"
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  artifactName: "DKA-POS-${arch}-${version}.${ext}"

nsis:
  artifactName: "DKA-POS-Setup-${version}.${ext}"
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: false
  allowElevation: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  uninstallDisplayName: "DKA Cashier POS Apps"
  shortcutName: "DKA Cashier POS"
  createDesktopShortcut: always
  createStartMenuShortcut: true
  include: "resources/scripts/installer-acl.nsh"

portable:
  artifactName: "DKA-POS-Portable-${version}.${ext}"

linux:
  category: Utility
  executableName: "DKA-Cashier-POS"     # ⬅️ nama .exe final, bebas spasi/uppercase
  icon: resources/icon.png
  maintainer: "Yovangga Anandhika <dka.tech.dev@gmail.com>"
  synopsis: "POS App untuk Kasir"
  description: "DKA Cashier POS Apps"
  target:
    #- AppImage
    - deb
  # Catatan: AppImage sudah pakai squashfs + xz, top-level 'compression'
  # tetap dipakai untuk tahap packing internal, tapi efek akhirnya bisa kecil.

appImage:
# systemIntegration: true

deb:
  depends:
    - gconf2
    - gconf-service
  priority: optional

snap:
  confinement: strict
  grade: stable
  plugs:
    - network
    - desktop

# ⬇️ Data writable: tetap di luar ASAR
extraFiles:
#  - from: ./uploads
#    to: uploads
#    filter:
#      - "**/*"
  - from: ./database
    to: database
    filter:
      - "**/*"