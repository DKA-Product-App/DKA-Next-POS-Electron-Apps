appId: com.dkaapis.product.pos
productName: DKA Cashier POS Apps
copyright: Copyright © 2025 Yovangga Anandhika
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app
publish: null

mac:
  icon: resources/icon.icns

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  # Boleh ada default buat yang lain-lain
  artifactName: "DKA-POS-${arch}-${version}.${ext}"

nsis:
  artifactName: "DKA-POS-Setup-${version}.${ext}"
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  uninstallDisplayName: "DKA Cashier POS Apps"
  shortcutName: "DKA Cashier POS"
  createDesktopShortcut: always
  createStartMenuShortcut: true

portable:
  artifactName: "DKA-POS-Portable-${version}.${ext}"

linux:
  category: Utility
  icon: resources/icon.png
  maintainer: "Yovangga Anandhika <dka.tech.dev@gmail.com>"
  synopsis: "POS App untuk Kasir"
  description: "DKA Cashier POS Apps"
  target:
    - AppImage
    #- snap
    # - deb

appImage:
# systemIntegration: true

deb:
  depends:
    - gconf2
    - gconf-service
  priority: optional

snap:
  confinement: strict
  grade: stable
  plugs:
    - network
    - desktop
