appId: com.dkaapis.product.pos
productName: DKA Cashier POS Apps
copyright: Copyright © 2025 Yovangga Anandhika

# ⬇️ Global options
compression: normal          # store | normal | maximum
asar: true                    # biar sumber di-pack ke app.asar
asarUnpack:
  - "**/*.node"               # kalau ada native addon, auto unpack

directories:
  output: dist
  buildResources: resources

files:
  - from: .
    filter:
      - package.json
      - app

publish: null

electronLanguages: []

mac:
  icon: resources/icon.icns

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  artifactName: "DKA-POS-${arch}-${version}.${ext}"

nsis:
  artifactName: "DKA-POS-Setup-${version}.${ext}"
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  uninstallDisplayName: "DKA Cashier POS Apps"
  shortcutName: "DKA Cashier POS"
  createDesktopShortcut: always
  createStartMenuShortcut: true

portable:
  artifactName: "DKA-POS-Portable-${version}.${ext}"

linux:
  category: Utility
  icon: resources/icon.png
  maintainer: "Yovangga Anandhika <dka.tech.dev@gmail.com>"
  synopsis: "POS App untuk Kasir"
  description: "DKA Cashier POS Apps"
  target:
    - AppImage
  # Catatan: AppImage sudah pakai squashfs + xz, top-level 'compression'
  # tetap dipakai untuk tahap packing internal, tapi efek akhirnya bisa kecil.

appImage:
# systemIntegration: true

deb:
  depends:
    - gconf2
    - gconf-service
  priority: optional

snap:
  confinement: strict
  grade: stable
  plugs:
    - network
    - desktop

# ⬇️ Data writable: tetap di luar ASAR
extraFiles:
  - from: ./uploads
    to: uploads
    filter:
      - "**/*"
