name: Action Compile Development Windows CI/CD
#
on:
  push:
    branches:
      - stage-server
  pull_request:
    branches:
      - stage-server

env:
  WA_CHAT_ID: '120363038030543096@g.us'

permissions:
  contents: write  # dibutuhkan untuk ncipollo/release-action

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout code dari Git Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Electron App
        run: yarn build --win

      - name: Show Dir
        run: |
          cd dist
          ls

      - name: Publish single Release
        uses: ncipollo/release-action@v1
        with:
          tag: server
          name: "Server"
          allowUpdates: true
          draft: true
          prerelease: false
          artifacts: dist/*.exe
      #- name: Upload Windows artifact
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: windows-setup
      #    path: dist/*.exe

  release:
    if: false
    runs-on: ubuntu-latest
    needs: [ windows ]
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: ./artifacts

      - name: Publish single Release
        uses: ncipollo/release-action@v1
        with:
          tag: server
          name: "Server"
          allowUpdates: true
          draft: true
          prerelease: true
          artifacts: ./artifacts/**